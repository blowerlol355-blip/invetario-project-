# Integración continua de StockPilot.
#
# - quality: lint, formato, tipos, tests unitarios con cobertura y build (sin base de datos).
# - e2e: usa el PostgreSQL preinstalado en el runner de Ubuntu (servicio nativo, sin contenedores),
#   aplica las migraciones y el seed, y ejecuta los tests de Playwright contra el build de producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Variables mínimas para `next build` y los tests unitarios (no se conecta a la base).
  SKIP_ENV_VALIDATION: "true"
  AUTH_SECRET: ci-secret-de-al-menos-treinta-y-dos-caracteres-0123456789
  DATABASE_URL: "postgresql://postgres:StockPilot_CI_2026@localhost:5432/stockpilot"

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios con cobertura
        run: npm run test:coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build de producción
        run: npm run build

  e2e:
    name: Tests E2E (Playwright + PostgreSQL)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "false"
      APP_TIMEZONE: America/Caracas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Iniciar PostgreSQL (preinstalado en el runner, sin contenedores)
        run: |
          sudo systemctl start postgresql.service
          pg_isready -t 30
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'StockPilot_CI_2026';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE stockpilot;"

      - name: Instalar dependencias
        run: npm ci

      - name: Migrar y sembrar
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Build de producción
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
