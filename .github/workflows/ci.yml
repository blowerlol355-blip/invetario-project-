# Integración continua de StockPilot.
#
# - quality: lint, formato, tipos, tests unitarios con cobertura y build (sin base de datos).
# - e2e: instala SQL Server 2022 de forma nativa en el runner (sin contenedores), aplica las
#   migraciones y el seed, y ejecuta los tests de Playwright contra el build de producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Variables mínimas para `next build` y los tests unitarios (no se conecta a la base).
  SKIP_ENV_VALIDATION: "true"
  AUTH_SECRET: ci-secret-de-al-menos-treinta-y-dos-caracteres-0123456789
  DATABASE_URL: "sqlserver://localhost:1433;database=stockpilot;user=sa;password=StockPilot_CI_2026!;encrypt=true;trustServerCertificate=true"

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios con cobertura
        run: npm run test:coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build de producción
        run: npm run build

  e2e:
    name: Tests E2E (Playwright + SQL Server)
    runs-on: ubuntu-22.04
    needs: quality
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "false"
      MSSQL_SA_PASSWORD: StockPilot_CI_2026!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar SQL Server 2022 (Developer, nativo)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/mssql-server-2022 jammy main" | sudo tee /etc/apt/sources.list.d/mssql-server-2022.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq mssql-server
          sudo ACCEPT_EULA=Y MSSQL_PID=Developer MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql/bin/mssql-conf -n setup
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "SQL Server escucha en 1433"; break; fi
            sleep 2
          done
          sleep 5

      - name: Instalar dependencias
        run: npm ci

      - name: Crear base, migrar y sembrar
        run: |
          npm run db:create
          npm run db:deploy
          npm run db:seed

      - name: Build de producción
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
